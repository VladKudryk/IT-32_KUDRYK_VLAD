<div class="movie-card">
  <h3 class="movie-card__title">{{ title }}</h3>
  <p class="movie-card__info">Жанр: {{ genre }}</p>
  <p class="movie-card__info">Рік: {{ year }}</p>
  <p class="movie-card__rating">Рейтинг: {{ rating }}</p>
  <button class="movie-card__button" (click)="onAddClick()">Додати в обране</button>
</div>
