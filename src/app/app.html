<h1> Моя бібліотека </h1>

<div *ngFor="let book of books()">
  <h3>{{ book.title }}</h3>
  <p>Автор: {{ book.author }}</p>
  <p>Сторінок: {{ book.pages }}</p>
  <button (click)="removeBook(book.id)"> Видалити </button>
</div>

<h2> Додати книгу </h2>

<label> Назва: <input [(ngModel)]="newTitle" name="title"></label><br>
<label> Автор: <input [(ngModel)]="newAuthor" name="author"></label><br>
<label> Кількість сторінок: <input type="number" [(ngModel)]="newPages" name="pages"></label><br>

<button (click)="addBook()">Додати книгу</button
